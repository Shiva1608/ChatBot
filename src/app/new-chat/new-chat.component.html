<div class="flex h-screen bg-gradient-to-br from-gray-800 to-gray-900">
  <!-- Sidebar -->
  <div class="sidebar fixed top-16 bottom-0 w-[400px] p-4 overflow-y-auto bg-gray-900 text-white shadow-md">
    <div class="text-gray-100 text-xl">
      <div class="p-3 flex items-center rounded-md duration-300 cursor-pointer hover:bg-blue-700 transition-transform transform hover:scale-105">
        <i class="bi bi-house-door-fill"></i>
        <span class="text-[16px] ml-4 font">{{ url }}</span>
      </div>
      <div class="my-3 bg-gray-600 h-[1px]"></div>
    </div>

    <!-- Sidebar Links -->
    <div class="p-2 mt-3 text-xl font-bold">
      <span class="text">History</span>
    </div>

    <!-- History of Chats -->
    <div *ngFor="let chat of history;">
      <div *ngIf="chat['chat_id'] !== url">
        <div [routerLink]="['/', chat['chat_id']]" class="p-3 mt-3 flex items-center rounded-md duration-300 cursor-pointer hover:bg-blue-700 transition-transform transform hover:scale-105">
          <i class="bi bi-chat-left-text"></i>
          <span class="text-[15px] ml-4">{{ chat['chat_description'] }}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content Area -->
  <div class="flex-1 flex flex-col ml-[400px] mt-16">
    <!-- Body -->
    <div class="main mt-8 flex-1 p-6 overflow-y-auto mx-20 bg-transparent rounded-lg shadow-lg" style="max-height: calc(100vh - 200px);">
      <div *ngFor="let question of inputText; let index = index;">
        <!-- Question -->
        <div class="chat-message bg-gray-700 border border-blue-500 rounded-lg text-white p-4 mb-4 max-w-xl ml-auto shadow-md">
          {{ question }}
        </div>

        <!-- Loader -->
        <div *ngIf="loadingIndex !== null && loadingIndex === index" class="flex justify-center mt-4">
          <div class="loader"></div>
        </div>

        <!-- Answer -->
        <div *ngIf="loadingIndex !== index || loadingIndex === null" class="chat-message bg-gray-700 border border-gray-600 rounded-lg text-white p-4 mb-4 max-w-xl relative shadow-md">
          <div markdown [data]="responses[index]"></div>
          <i class="fa-solid fa-copy ml-2 cursor-pointer text-gray-400 hover:text-blue-400 transition duration-200"
             (click)="copyToClipboard(responses[index])"
             title="Copy to Clipboard">
          </i>
        </div>
      </div>
    </div>

    <!-- Footer (Chat Input) -->
    <div class="p-4 flex justify-center fixed bottom-0 left-0 right-0 ml-[400px]">
        <textarea
        [(ngModel)]="prompt"
        placeholder="Ask your second brain..."
        class="w-3/4 mx-auto bg-gray-800  text-xl text-white placeholder-gray-400 border-none rounded-s-full rounded-e-full pt-7 pl-10 pr-16 py-3 h-20 resize-none focus:outline-none focus:shadow-none"
        rows="4"
        (keydown)="onKeyDown($event)"
      ></textarea>

      <!-- Send button -->
      <button (click)="nextQuery()" class="absolute right-48 bottom-0.5 flex items-center justify-center text-gray-400 h-full hover:text-blue-500 transition duration-200">
        <i class="fas fa-arrow-right fa-2x"></i>
      </button>

    </div>

  </div>
</div>
